name: Android smoke test

on:
  push:
    paths:
      - "android-pdf-signer/**"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-pdf-signer
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Installe l'app sur un émulateur, la lance et affiche tout plantage (pile d'appels)
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android-pdf-signer
          script: bash ../.github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: android-pdf-signer/smoke/
