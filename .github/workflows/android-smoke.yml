name: Android smoke test

on:
  push:
    paths:
      - "android-pdf-signer/**"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-pdf-signer
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Installe l'app sur un émulateur, la lance et affiche tout plantage (pile d'appels)
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: android-pdf-signer
          script: bash ../.github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulateur-captures-et-video
          path: |
            android-pdf-signer/smoke/screens/
            android-pdf-signer/smoke/parcours.mp4
            android-pdf-signer/smoke/crash.txt
            android-pdf-signer/smoke/logcat.txt
      # Captures et vidéo aussi publiées sur une branche dédiée, consultable directement sur GitHub
      - name: Publish screenshots branch
        if: always()
        working-directory: android-pdf-signer/smoke
        run: |
          mkdir -p pub && cp -r screens pub/ && cp parcours.mp4 pub/ 2>/dev/null || true
          cp crash.txt pub/ 2>/dev/null || true
          cd pub
          git init -q -b emulateur-captures
          git add -A
          git -c user.name="emulator-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Captures émulateur (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulateur-captures
