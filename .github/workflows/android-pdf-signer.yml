name: Android PDF Signer

on:
  push:
    paths:
      - "android-pdf-signer/**"
      - ".github/workflows/android-pdf-signer.yml"
  pull_request:
    paths:
      - "android-pdf-signer/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-pdf-signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-signer-debug-apk
          path: android-pdf-signer/app/build/outputs/apk/debug/app-debug.apk
