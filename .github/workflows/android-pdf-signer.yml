name: Android PDF Signer

on:
  push:
    paths:
      - "android-pdf-signer/**"
      - ".github/workflows/android-pdf-signer.yml"
  pull_request:
    paths:
      - "android-pdf-signer/**"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-pdf-signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Le SDK Android est préinstallé sur les runners ubuntu-latest (ANDROID_HOME)
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-signer-debug-apk
          path: android-pdf-signer/app/build/outputs/apk/debug/app-debug.apk

  build-play-bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/codex-play-store-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-pdf-signer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Play upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ithamedia-upload.jks"
      - name: Build signed Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ithamedia-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ithamedia-play-aab
          path: android-pdf-signer/app/build/outputs/bundle/release/app-release.aab